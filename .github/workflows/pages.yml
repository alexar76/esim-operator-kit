name: Pages — landing and live badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-esim-operator-kit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.measure.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --prefix rails --no-audit --no-fund
      - run: npm ci --prefix store --no-audit --no-fund
      # The tests badge in the README reads this file through shields.io/endpoint, so it shows what
      # this commit's run counted, not a number somebody typed.
      - name: count the tests for the badge
        id: measure
        run: |
          set +e
          (cd rails && node --test --test-reporter=tap "test/**/*.test.js") > rails.tap 2>&1; r=$?
          (cd store && node --test --test-reporter=tap "test/**/*.test.js") > store.tap 2>&1; s=$?
          pass=$(cat rails.tap store.tap | sed -n 's/^# pass \([0-9]*\)$/\1/p' | awk '{n+=$1} END {print n+0}')
          fail=$(cat rails.tap store.tap | sed -n 's/^# fail \([0-9]*\)$/\1/p' | awk '{n+=$1} END {print n+0}')
          mkdir -p docs/landing/badges
          if [ "$fail" = "0" ] && [ "$r" = "0" ] && [ "$s" = "0" ]; then color=brightgreen; msg="$pass passing"; else color=red; msg="$fail failing"; fi
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' "$msg" "$color" > docs/landing/badges/tests.json
          cat docs/landing/badges/tests.json
          echo "status=$((r + s))" >> "$GITHUB_OUTPUT"
      - run: touch docs/landing/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: docs/landing

  # The only job that can mint an OIDC token runs no third-party code: installs and tests (a pull
  # request's dependencies included) run above without one.
  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages source is GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "/repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
      - name: fail the run when the tests failed (after the red badge is live)
        if: needs.build.outputs.status != '0'
        run: exit 1
